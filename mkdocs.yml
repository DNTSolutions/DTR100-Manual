site_name: DTR100 Grinder Manual
site_description: Technical Manual for DTR100 Electrode Grinder
site_author: Your Company Name
site_url: https://DNTSolutions.github.io/DTR100-Manual/

repo_name: DTR100-Manual
repo_url: https://github.com/DNTSolutions/DTR100-Manual

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs          # tabs trên đầu
    - navigation.tabs.sticky   # tabs cố định khi scroll
    - navigation.sections      # sidebar có section rõ ràng
    - navigation.top           # nút "Back to top"
    - search.highlight         # highlight kết quả search
    - search.suggest           # gợi ý khi gõ search
    - content.code.copy        # nút copy code block
    - toc.integrate            # Table of Contents tích hợp sidebar
  font:
    text: Roboto
    code: Roboto Mono
  logo: assets/logo.png
  favicon: assets/favicon.ico

extra:
  version:
    provider: mike             # hỗ trợ versioning (v1.0, v2.0...)
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DNTSolutions

markdown_extensions:
  - admonition                 # hộp note/warning/tip
  - pymdownx.details           # collapsible sections
  - pymdownx.superfences       # code block nâng cao
  - pymdownx.tabbed:
      alternate_style: true    # tabs trong nội dung
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - tables
  - toc:
      permalink: true          # icon link cho mỗi heading

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Safety Warning: getting-started/safety.md
      - Installation: getting-started/installation.md
  - Hardware:
      - Machine Overview: hardware/overview.md
      - Specifications: hardware/specifications.md
      - Wiring Diagram: hardware/wiring.md
      - Spare Parts: hardware/spare-parts.md
  - Software:
      - System Requirements: software/requirements.md
      - Setup Guide: software/setup.md
      - Parameters: software/parameters.md
  - Operation:
      - Basic Operation: operation/basic.md
      - Electrode Grinding: operation/electrode-grinding.md
      - Maintenance: operation/maintenance.md
  - Troubleshooting: troubleshooting.md
  - Changelog: changelog.md
